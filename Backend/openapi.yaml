openapi: 3.1.0
info:
  title: Dhobi Matrimony API
  version: 1.0.0
  description: |
    Contract for the Dhobi Matrimony member and admin API. The consent
    endpoints record append-only, versioned evidence of what a member agreed
    to, in which language and version, from which IP and device, and when the
    agreement expires.
servers:
  - url: /api/v1
tags:
  - name: Consents
    description: Versioned consent documents and append-only consent records
  - name: Auth
    description: Registration, OTP and sessions
  - name: Profiles
    description: Member profile steps
  - name: Discovery
    description: Approved-only recommendations, search and profile detail
  - name: Shortlists
    description: Private named shortlists of approved profiles
  - name: Account
    description: Account settings, logout everywhere, data export and account deletion
security:
  - bearerAuth: []
paths:
  /consents/documents:
    get:
      tags: [Consents]
      security: []
      summary: Active consent documents for pre-registration clients
      description: |
        Public. Returns every active consent document with the `code`, `version`
        and `hash` that POST /auth/register requires, plus the exact text served
        in the requested language. Language resolution matches
        GET /consents/current: query parameter, then Accept-Language, then
        English, with a per-document fallback to English. No member data is
        exposed.
      parameters:
        - name: language
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ConsentLanguage'
      responses:
        '200':
          description: Active consent documents in the resolved language
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentDocumentsResponse'
        '400':
          description: Unsupported explicit language value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /consents/current:
    get:
      tags: [Consents]
      summary: Current consent documents for the authenticated member
      description: |
        Returns every active consent document. Text is served in the requested
        language (query parameter, then Accept-Language) and falls back to
        English when a translation is missing. The latest record for each code
        is included so the client can show whether consent is current, expired
        or requires re-consent.
      parameters:
        - name: language
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ConsentLanguage'
      responses:
        '200':
          description: Active consent documents and the member's latest record per code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentConsentsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /consents:
    get:
      tags: [Consents]
      summary: The member's own consent records, newest first
      responses:
        '200':
          description: Append-only consent history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecordsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Consents]
      summary: Record acceptance of the currently active consent document
      description: |
        Writes one append-only record with the member id and name, the exact
        text served for the document version and language, the client IP and
        user agent, the grant time, an expiry exactly 24 months later and the
        source. A version or document hash that does not match the active
        document is rejected and no record is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordConsentRequest'
      responses:
        '201':
          description: The stored consent record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
        '400':
          $ref: '#/components/responses/ConsentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /consents/renew:
    post:
      tags: [Consents]
      summary: Re-consent after the 24-month expiry
      description: |
        Writes a new append-only record with a fresh grant time and expiry. The
        earlier record is left unchanged. The request and response bodies are
        identical to POST /consents; the stored source is `renewal`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordConsentRequest'
      responses:
        '201':
          description: The new consent record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
        '400':
          $ref: '#/components/responses/ConsentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Start registration and record the required consents
      description: |
        Requires the terms, privacy and id_processing consents. When any is
        missing or stale the request fails with the shared error envelope and
        the details list the missing consent codes; no account is created. A
        successful registration writes one consent record per accepted code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration started; an OTP is issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Validation failure or missing/stale required consents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: An account already exists with these details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /profiles/step-1:
    put:
      tags: [Profiles]
      summary: Save personal details (step 1), enforcing the minimum age
      description: |
        Saves gender, date of birth and the other personal details. Age is
        derived from `dateOfBirth` and today's UTC date in whole calendar years
        and is never stored. A member whose gender minimum (`AGE_MIN_MALE`,
        default 21; `AGE_MIN_FEMALE`, default 18) is not met is rejected with
        `AGE_BELOW_MINIMUM`; a date of birth in the future is rejected with
        `INVALID_DATE_OF_BIRTH`. A person born on 29 February reaches each
        birthday on 1 March in non-leap years. Nothing is saved on rejection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePersonalDetailsRequest'
      responses:
        '200':
          description: Personal details saved; the member's profile is returned
          content:
            application/json:
              schema:
                type: object
        '400':
          description: |
            Rejected. `code` is one of `AGE_BELOW_MINIMUM` (details
            `{ "minimumAge": 21 }`), `INVALID_DATE_OF_BIRTH` (future date), or
            `VALIDATION_ERROR` (details `{ "issues": [...] }`, including a
            `dateOfBirth` issue for a value that is not a real calendar date).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                belowMinimum:
                  value:
                    code: AGE_BELOW_MINIMUM
                    message: Members must be at least 21 years old.
                    details: { minimumAge: 21 }
                    requestId: 7d0c6c3e-0f0b-4b0e-9f5e-2f1f3f2f1a11
                futureDate:
                  value:
                    code: INVALID_DATE_OF_BIRTH
                    message: Date of birth must be a real date that is not in the future.
                    details: { field: dateOfBirth }
                    requestId: 7d0c6c3e-0f0b-4b0e-9f5e-2f1f3f2f1a12
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: '`PROFILE_LOCKED_IN_REVIEW`: the profile is `submitted`; withdraw it before editing (the same applies to `PUT /profiles/step-2` to `step-5`). A body carrying `status`, `accountStatus`, `profileReviewStatus` or `reviewStatus` is 400 `VALIDATION_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /profiles/submit:
    post:
      tags: [Profiles]
      summary: Submit the profile for review (or resubmit after requested changes)
      description: |
        Moves `draft` or `needsChanges` to `submitted` and starts the review SLA
        clock (`submittedAt`). Steps 1 to 5, the current required consents, the
        age gate and the KYC photo and ID must all be in place; otherwise 409
        `SUBMISSION_INCOMPLETE` with `details.missing` (for example `step-3`,
        `ageGate`, `consent`, `kycPhoto`, `kycId`) and nothing changes. A repeat
        call while `submitted` is a no-op that returns the same `submittedAt`.
        From `approved` or `rejected` the answer is 409
        `INVALID_STATUS_TRANSITION`. Takes no request body.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The profile is submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSubmissionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: '`SUBMISSION_INCOMPLETE` (`details.missing` lists the items) or `INVALID_STATUS_TRANSITION` (`details.status`, `details.event`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                incomplete:
                  value:
                    code: SUBMISSION_INCOMPLETE
                    message: The profile is missing required items.
                    details: { missing: [step-3, kycPhoto] }
                    requestId: 7d0c6c3e-0f0b-4b0e-9f5e-2f1f3f2f1a21
  /profiles/withdraw:
    post:
      tags: [Profiles]
      summary: Withdraw a submitted profile back to draft
      description: |
        Moves `submitted` to `draft`; the profile leaves the admin queue and the
        SLA clock is cleared (`submittedAt` is null). From any other status the
        answer is 409 `INVALID_STATUS_TRANSITION`. Takes no request body.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The profile is a draft again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSubmissionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: '`INVALID_STATUS_TRANSITION`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /profiles/matches:
    get:
      tags: [Profiles]
      summary: Legacy list of visible members (approved members only)
      deprecated: true
      description: |
        Kept for existing clients; use `GET /discovery/search`. It serves the
        first page (up to 50) of the same search, with the same hard filters and
        the same cards (no `profileUid`, no internal id, no date of birth).
        While the member's `profileReviewStatus` is not `approved` the answer is
        403 `PROFILE_NOT_APPROVED` with `details.status` set to the current
        status.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The matches
          content:
            application/json:
              schema:
                type: object
                required: [total, matches]
                properties:
                  total:
                    type: integer
                  matches:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiscoveryCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`PROFILE_NOT_APPROVED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                notApproved:
                  value:
                    code: PROFILE_NOT_APPROVED
                    message: Your profile must be approved before you can use this feature.
                    details: { status: submitted }
                    requestId: 7d0c6c3e-0f0b-4b0e-9f5e-2f1f3f2f1a22
  /discovery/recommendations:
    get:
      tags: [Discovery]
      summary: Today's recommendations (approved members only)
      description: |
        At most `DAILY_RECOMMENDATIONS` (default 9) distinct approved profiles
        per member per UTC day. The set is fixed on the first call of the day and
        is the same on later calls; a profile hidden or no longer approved
        afterwards is dropped. A member with no candidate gets `items: []` and
        200. The same hard filters as search apply (self, hidden, blocked, not
        approved, under the age gate, same gender).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Today's recommendations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 9
                    items:
                      $ref: '#/components/schemas/DiscoveryCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProfileNotApproved'
  /discovery/search:
    get:
      tags: [Discovery]
      summary: Search approved members (cursor pagination)
      description: |
        Newest profiles first. Hard filters (approved only, never the caller,
        never a profile the caller hid, never blocked, never under the age gate,
        opposite gender) run in the database query. Unknown query parameters are
        rejected with 400 `VALIDATION_ERROR`; there is no age or height filter
        and no profile-ID search. There is no rate limit on this endpoint.
        `nextCursor` is opaque; a malformed or tampered one answers 400
        `INVALID_CURSOR`.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [newest], default: newest }
        - name: maritalStatus
          in: query
          required: false
          schema:
            type: string
            enum: [neverMarried, widower, awaitingDivorce, divorced]
        - name: religion
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 50 }
        - name: community
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: state
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: city
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: diet
          in: query
          required: false
          schema:
            type: string
            enum: [vegetarian, nonVegetarian, eggetarian]
      responses:
        '200':
          description: One page of result cards
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiscoveryCard'
                  nextCursor:
                    type: [string, 'null']
                    description: Null on the last page.
        '400':
          description: |
            `VALIDATION_ERROR` (unknown parameter, `limit` out of 1..50, bad
            filter value, `sort` not allowed) or `INVALID_CURSOR`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProfileNotApproved'
  /profiles/{profileRef}:
    get:
      tags: [Discovery]
      summary: Profile detail by opaque profileRef (approved members only)
      description: |
        Full detail of an approved, visible profile. Contact fields are never
        returned in this phase and `profileUid` is never exposed. An unknown or
        malformed ref, a profile that is not approved, one the caller hid, and
        the caller's own all answer the same 404 `PROFILE_NOT_FOUND`. A
        successful read records at most one profile view per viewer, target and
        UTC day.
      security:
        - bearerAuth: []
      parameters:
        - name: profileRef
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{32}$' }
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProfileNotApproved'
        '404':
          description: '`PROFILE_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /kyc/verification:
    post:
      tags: [KYC]
      summary: Create the member's manual KYC case
      description: |
        Requires a valid, unexpired consent for every required code (story 1).
        The case starts as `consentGiven`. A member has at most one case.
        The body must be empty: any field (for example `status` or `userId`) is
        rejected with `VALIDATION_ERROR`. Responses carry
        `Cache-Control: private, no-store`.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Case created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycVerification'
        '400':
          $ref: '#/components/responses/KycBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Consent is missing, expired or stale (`CONSENT_REQUIRED`); no case is created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`VERIFICATION_ALREADY_EXISTS`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      tags: [KYC]
      summary: Read the member's KYC case
      description: |
        The ID number is returned only as `idNumberLast4`. No storage key is
        ever returned.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycVerification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/KycNotFound'
  /kyc/verification/uploads:
    post:
      tags: [KYC]
      summary: Request a presigned upload URL
      description: |
        The client uploads the bytes straight to object storage with `PUT` to
        `uploadUrl`, sending the returned `headers`; no file bytes pass through
        this API. The URL expires in 10 minutes. For `kycId`, `documentType` and
        `idNumber` are required; the number is stored encrypted. `kycPhoto`
        accepts JPEG, PNG, WebP; `kycId` also accepts PDF; at most 10 MB
        (10485760 bytes) each.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycUploadRequest'
      responses:
        '201':
          description: Upload ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycUploadTicket'
        '400':
          description: |
            `VALIDATION_ERROR` (field-level issues, e.g. an unlisted
            `documentType`), `FILE_TOO_LARGE` (declared size above 10 MB),
            `FILE_TYPE_NOT_ALLOWED` (type not accepted at all) or
            `FILE_TYPE_NOT_ALLOWED_FOR_PURPOSE` (e.g. a PDF for `kycPhoto`).
            Nothing is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/KycNotFound'
        '409':
          $ref: '#/components/responses/KycInvalidTransition'
  /kyc/verification/uploads/{mediaId}/complete:
    post:
      tags: [KYC]
      summary: Confirm an upload and attach it to the case
      description: |
        The API checks that the object exists, that its size equals the declared
        size, that its SHA-256 equals `checksum`, and that its leading bytes
        (magic bytes) match the declared type and are allowed for the purpose.
        On success the file is attached; the case becomes `documentUploaded`
        and, once both files are present, `needsReview`. On any rejection
        nothing is attached. Repeating the call for an attached file is a no-op.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycCompleteRequest'
      responses:
        '200':
          description: The updated case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycVerification'
        '400':
          description: |
            `UPLOAD_NOT_FOUND`, `SIZE_MISMATCH`, `CHECKSUM_MISMATCH`,
            `FILE_CONTENT_MISMATCH` (bytes are not the declared type, e.g. text
            renamed `.jpg`), `FILE_TYPE_NOT_ALLOWED_FOR_PURPOSE` (e.g. PDF bytes
            for `kycPhoto`) or `VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/KycNotFound'
        '409':
          $ref: '#/components/responses/KycInvalidTransition'
  /kyc/verification/uploads/{mediaId}:
    delete:
      tags: [KYC]
      summary: Discard an upload that was never attached
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '204':
          description: Discarded
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/KycNotFound'
        '409':
          description: '`MEDIA_ALREADY_ATTACHED`; replace an attached file by uploading a new one'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /kyc/verification/media/{mediaId}/url:
    get:
      tags: [KYC]
      summary: Get a short-lived signed read URL for an attached file
      description: The URL expires in 10 minutes; an expired or altered URL is refused by storage with 403.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Signed URL
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/KycBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/KycNotFound'
  /kyc/verification/restart:
    post:
      tags: [KYC]
      summary: Restart a failed or changes-needed case
      description: |
        Allowed only from `failed` or `changesNeeded`, at most 3 times in a
        rolling 24 hours. The fourth attempt returns 429 `RESTART_LIMIT_REACHED`
        with a `Retry-After` header (seconds). A restart clears the uploaded
        files and the ID details and returns the case to `consentGiven`.
        Requires valid consent. The body must be empty.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The restarted case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycVerification'
        '400':
          $ref: '#/components/responses/KycBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`CONSENT_REQUIRED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/KycNotFound'
        '409':
          $ref: '#/components/responses/KycInvalidTransition'
        '429':
          description: '`RESTART_LIMIT_REACHED`'
          headers:
            Retry-After:
              description: Seconds until a restart is allowed again
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /admin/profiles/pending:
    get:
      tags: [Admin review]
      summary: Review queue, oldest submission first
      description: |
        Members whose photo and ID are both uploaded and whose case is in
        `needsReview`. `slaRemainingHours` counts business hours only (see
        `REVIEW_*` settings) and may be negative. `slaState` is `ok` under 36
        business hours, `atRisk` from 36, `overdue` from 48. The SLA is an
        internal admin measure and is never sent to members.
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: The queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
  /admin/profiles/{userId}:
    get:
      tags: [Admin review]
      summary: Review workspace for one member
      description: |
        Photo (short-lived signed URL), ID document (reference to the audited
        `id-document` endpoint), document type, ID number masked to its last 4
        characters, member-entered name and date of birth, computed age and the
        age-gate result (men 21, women 18). Viewing does not change any status.
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewWorkspace'
        '400':
          $ref: '#/components/responses/AdminBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/AdminNotFound'
  /admin/profiles/{userId}/id-document:
    get:
      tags: [Admin review]
      summary: Open the member's ID document
      description: |
        Returns a short-lived signed URL (10 minutes). Every call writes an
        `AdminAuditLog` row with action `VIEW_DOCUMENT`, the admin id, request
        id, IP and user agent.
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Signed URL
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt, contentType]
                properties:
                  url:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  contentType:
                    type: string
        '400':
          $ref: '#/components/responses/AdminBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/AdminNotFound'
  /admin/profiles/{userId}/approve:
    patch:
      tags: [Admin review]
      summary: Approve the submission
      description: |
        `reasonCode` is optional but, when sent, must be one of the eleven
        codes. Recorded with the audit row in one transaction. Allowed only when
        the member is pending and the case is in `needsReview`.
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecisionRequest'
      responses:
        '200':
          $ref: '#/components/responses/ReviewDecisionDone'
        '400':
          $ref: '#/components/responses/AdminBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/AdminNotFound'
        '409':
          $ref: '#/components/responses/AdminInvalidTransition'
  /admin/profiles/{userId}/reject:
    patch:
      tags: [Admin review]
      summary: Reject the submission
      description: |
        `reasonCode` is required (any of the eleven codes); a missing or unknown
        code is 400 `INVALID_REASON_CODE` with the allowed values in `details`.
        This replaces the earlier free-text `reason` field. `notes` is at most
        500 characters.
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecisionRequest'
      responses:
        '200':
          $ref: '#/components/responses/ReviewDecisionDone'
        '400':
          $ref: '#/components/responses/AdminBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/AdminNotFound'
        '409':
          $ref: '#/components/responses/AdminInvalidTransition'
  /admin/profiles/{userId}/request-changes:
    patch:
      tags: [Admin review]
      summary: Ask the member to fix flagged sections
      description: |
        `reasonCode` is required and may not be `under-age` or
        `duplicate-account` (400 `INVALID_REASON_CODE`). `notes` (1 to 500
        characters after trim) and `sections` (at least one of `step-1` to
        `step-5`) are required. The member sees the decision in
        `GET /profiles/me` under `profile.user.reviewDecision`.
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecisionRequest'
      responses:
        '200':
          $ref: '#/components/responses/ReviewDecisionDone'
        '400':
          $ref: '#/components/responses/AdminBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/AdminNotFound'
        '409':
          $ref: '#/components/responses/AdminInvalidTransition'
  /admin/profiles/{userId}/reopen:
    post:
      tags: [Admin review]
      summary: Reopen a rejected profile so the member can resubmit
      description: |
        Allowed only from `rejected`; moves the profile to `needsChanges` and
        `accountStatus` to `pending`, so the member can edit and `POST
        /profiles/submit` again with the earlier data kept. `reasonCode` is
        required (any of the eleven codes; 400 `INVALID_REASON_CODE` otherwise).
        `notes` is at most 500 characters. Exactly one audit row is written
        (action `reopen`, statusBefore `rejected`, statusAfter `needsChanges`). From any other status the answer is 409
        `INVALID_STATUS_TRANSITION` and nothing is written. `status`,
        `accountStatus`, `profileReviewStatus` and `adminId` in the body are 400.
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReopenProfileRequest'
      responses:
        '200':
          $ref: '#/components/responses/ReviewDecisionDone'
        '400':
          $ref: '#/components/responses/AdminBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/AdminNotFound'
        '409':
          $ref: '#/components/responses/AdminInvalidTransition'
  /interests:
    post:
      tags: [Interests]
      summary: Send an interest (approved members only)
      description: |
        Sending is free. The receiver must be an approved, visible member
        other than the caller. Self is 400 `CANNOT_INTEREST_SELF`; an unknown,
        malformed, hidden or non-approved receiver answers the same 404
        `PROFILE_NOT_FOUND`. A second active (`pending` or `accepted`)
        interest to the same receiver is 409 `INTEREST_ALREADY_EXISTS`,
        guaranteed by a partial unique index. After a decline the sender is
        blocked for `INTEREST_RESEND_COOLDOWN_DAYS` (default 30): 409
        `INTEREST_COOLDOWN` with `details.retryAfter`. When
        `INTEREST_DAILY_SEND_LIMIT` is set, send N+1 in a UTC day is 429
        `RATE_LIMITED`; unset means unlimited. `status`, `senderId`,
        `respondedAt` and `canChat` in the body are 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendInterestRequest'
      responses:
        '201':
          description: Interest sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interest'
        '400':
          description: '`CANNOT_INTEREST_SELF` or `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProfileNotApproved'
        '404':
          description: '`PROFILE_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`INTEREST_ALREADY_EXISTS` or `INTEREST_COOLDOWN` (`details.retryAfter`, ISO date)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: '`RATE_LIMITED`: the configured daily send limit was reached'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /interests/sent:
    get:
      tags: [Interests]
      summary: Interests the caller sent (newest first, cursor pagination)
      description: |
        Only the caller's own rows. A declined interest shows the neutral
        `statusLabel` "Not accepted" and never a reason. `canChat` is true only
        when the status is `accepted`. Each item carries the other member as a
        story 6 card (no contact fields). There is no `mutual` field.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InterestStatusFilter'
        - $ref: '#/components/parameters/InterestLimit'
        - $ref: '#/components/parameters/InterestCursor'
      responses:
        '200':
          $ref: '#/components/responses/InterestPage'
        '400':
          $ref: '#/components/responses/InterestBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProfileNotApproved'
  /interests/received:
    get:
      tags: [Interests]
      summary: Interests the caller received (newest first, cursor pagination)
      description: Same shape and rules as `GET /interests/sent`, for the receiver.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InterestStatusFilter'
        - $ref: '#/components/parameters/InterestLimit'
        - $ref: '#/components/parameters/InterestCursor'
      responses:
        '200':
          $ref: '#/components/responses/InterestPage'
        '400':
          $ref: '#/components/responses/InterestBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProfileNotApproved'
  /interests/{id}/accept:
    post:
      tags: [Interests]
      summary: Accept a received interest
      description: |
        Receiver only; the sender or a third member gets 404
        `INTEREST_NOT_FOUND`. Idempotent: repeating returns 200 with the same
        body and writes no second event. From `declined` or `withdrawn` it is
        409 `INVALID_STATUS_TRANSITION`. The body must be empty.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InterestId'
      responses:
        '200':
          $ref: '#/components/responses/InterestDone'
        '400':
          $ref: '#/components/responses/InterestBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProfileNotApproved'
        '404':
          $ref: '#/components/responses/InterestNotFound'
        '409':
          $ref: '#/components/responses/InterestInvalidTransition'
  /interests/{id}/decline:
    post:
      tags: [Interests]
      summary: Decline a received interest
      description: |
        Receiver only (404 `INTEREST_NOT_FOUND` otherwise). Idempotent. From
        `accepted` or `withdrawn` it is 409 `INVALID_STATUS_TRANSITION`. The
        sender is shown the neutral status "Not accepted", never a reason, and
        cannot resend for the cooldown period.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InterestId'
      responses:
        '200':
          $ref: '#/components/responses/InterestDone'
        '400':
          $ref: '#/components/responses/InterestBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProfileNotApproved'
        '404':
          $ref: '#/components/responses/InterestNotFound'
        '409':
          $ref: '#/components/responses/InterestInvalidTransition'
  /interests/{id}/withdraw:
    post:
      tags: [Interests]
      summary: Withdraw a pending interest
      description: |
        Sender only (404 `INTEREST_NOT_FOUND` for the receiver), and only from
        `pending`; any other status is 409 `INVALID_STATUS_TRANSITION`. A
        withdrawn interest is no longer active, so the sender may send again.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InterestId'
      responses:
        '200':
          $ref: '#/components/responses/InterestDone'
        '400':
          $ref: '#/components/responses/InterestBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProfileNotApproved'
        '404':
          $ref: '#/components/responses/InterestNotFound'
        '409':
          $ref: '#/components/responses/InterestInvalidTransition'
  /admin/interests/cooldown/clear:
    post:
      tags: [Admin review]
      summary: Lift the resend cooldown after an interest decline
      description: |
        Admin only (401 without a token, 403 for a member token). While a
        cooldown is active it is cleared, exactly one audit row is written
        (action `interestCooldownClear`, admin, sender, receiver, reasonCode,
        notes) and the sender can send again at once. With no active cooldown
        (never declined, expired or already cleared) the answer is 404
        `COOLDOWN_NOT_FOUND` and nothing is written. A missing or unknown
        `reasonCode` is 400 `INVALID_REASON_CODE`; unknown body fields are 400.
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearCooldownRequest'
      responses:
        '200':
          description: Cooldown cleared
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties:
                  cleared: { type: boolean, enum: [true] }
        '400':
          $ref: '#/components/responses/AdminBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: '`COOLDOWN_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /shortlists:
    get:
      tags: [Shortlists]
      summary: The caller's named shortlists (approved members only)
      description: |
        Private to the caller. The first call creates the default list
        `Shortlisted` (`isDefault: true`); later calls return the same id.
        Default list first, then by creation time.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shortlist'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProfileNotApproved'
    post:
      tags: [Shortlists]
      summary: Create a shortlist
      description: |
        `name` is 1 to 100 characters after trim (400 `VALIDATION_ERROR` with a
        field-level error on `name` otherwise). A duplicate name for the same
        member, case-insensitively, is 409 `SHORTLIST_NAME_TAKEN`. There is no
        default list-count limit. `userId` and `isDefault` in the body are 400.
        409 `SHORTLIST_LIMIT_EXCEEDED` exists only when `SHORTLIST_MAX_LISTS`
        is configured (configuration-dependent; unset means unlimited).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShortlistNameRequest'
      responses:
        '201':
          description: List created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shortlist'
        '400':
          $ref: '#/components/responses/ShortlistBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProfileNotApproved'
        '409':
          $ref: '#/components/responses/ShortlistConflict'
  /shortlists/{id}:
    patch:
      tags: [Shortlists]
      summary: Rename a shortlist
      description: |
        Another member's list id is 404 `SHORTLIST_NOT_FOUND` (never 403). The
        default list cannot be renamed: 409 `DEFAULT_SHORTLIST_PROTECTED`.
        Same name rules as create.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShortlistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShortlistNameRequest'
      responses:
        '200':
          description: List renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shortlist'
        '400':
          $ref: '#/components/responses/ShortlistBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProfileNotApproved'
        '404':
          $ref: '#/components/responses/ShortlistNotFound'
        '409':
          $ref: '#/components/responses/ShortlistConflict'
    delete:
      tags: [Shortlists]
      summary: Delete a shortlist
      description: |
        Removes the list and its memberships only; the profiles and their
        presence in the caller's other lists are untouched. The default list is
        409 `DEFAULT_SHORTLIST_PROTECTED`. Another member's list is 404
        `SHORTLIST_NOT_FOUND`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShortlistId'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProfileNotApproved'
        '404':
          $ref: '#/components/responses/ShortlistNotFound'
        '409':
          $ref: '#/components/responses/ShortlistConflict'
  /shortlists/{id}/profiles:
    get:
      tags: [Shortlists]
      summary: Profiles in a shortlist (story 6 cards, cursor pagination)
      description: |
        Cards only, newest addition first. A profile that is no longer approved
        or visible to the caller is omitted; its membership row is kept. Default
        page size 20, maximum 50.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShortlistId'
        - $ref: '#/components/parameters/InterestLimit'
        - $ref: '#/components/parameters/InterestCursor'
      responses:
        '200':
          description: One page of cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortlistProfilePage'
        '400':
          $ref: '#/components/responses/ShortlistBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProfileNotApproved'
        '404':
          $ref: '#/components/responses/ShortlistNotFound'
  /shortlists/{id}/profiles/{profileRef}:
    put:
      tags: [Shortlists]
      summary: Add a profile to a shortlist
      description: |
        Idempotent: adding the same profile twice is 200 with one membership.
        A profile may be in several lists. An unknown, malformed, non-approved
        or hidden profile is 404 `PROFILE_NOT_FOUND`; the caller's own is 400
        `CANNOT_SHORTLIST_SELF`. The shortlisted member is never notified.
        409 `SHORTLIST_LIMIT_EXCEEDED` exists only when `SHORTLIST_MAX_PROFILES`
        is configured (configuration-dependent; unset means unlimited).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShortlistId'
        - $ref: '#/components/parameters/ShortlistProfileRef'
      responses:
        '200':
          description: The profile is in the list
          content:
            application/json:
              schema:
                type: object
                required: [added]
                properties:
                  added: { type: boolean, enum: [true] }
        '400':
          $ref: '#/components/responses/ShortlistBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProfileNotApproved'
        '404':
          description: '`SHORTLIST_NOT_FOUND` or `PROFILE_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          $ref: '#/components/responses/ShortlistConflict'
    delete:
      tags: [Shortlists]
      summary: Remove a profile from a shortlist
      description: 'Idempotent, so it is 204 whether or not the profile was in the list. Another member''s list is 404 `SHORTLIST_NOT_FOUND`.'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShortlistId'
        - $ref: '#/components/parameters/ShortlistProfileRef'
      responses:
        '204':
          description: Removed (or was not present)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProfileNotApproved'
        '404':
          $ref: '#/components/responses/ShortlistNotFound'
  /account/settings:
    get:
      tags: [Account]
      summary: Read the member's own settings
      description: The member is taken from the access token; there is no id parameter.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountDeletionPending'
    patch:
      tags: [Account]
      summary: Update the member's own settings
      description: |
        Accepts only `language`, `notifications` and `profileVisibility`. Any
        other key (`role`, `accountStatus`, ...) or a value outside the allowed
        set (`language: fr`) is 400 `VALIDATION_ERROR` with field-level
        `details.issues`. `notifications` is merged: keys not sent keep their
        value.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountSettingsPatch'
      responses:
        '200':
          description: The settings after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSettings'
        '400':
          description: '`VALIDATION_ERROR` with field-level `details.issues`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountDeletionPending'
  /account/logout-all:
    post:
      tags: [Account]
      summary: End every session of the member
      description: |
        Revokes every refresh token and bumps the member's session version, so
        access tokens held by other devices (and the caller's own) are refused
        on their next request with 401. Other members are not affected.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every session ended
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountDeletionPending'
  /account/export-request:
    post:
      tags: [Account]
      summary: Request an export of the member's data
      description: |
        Step-up: the body carries the member's password. A wrong password is 403
        `STEP_UP_FAILED` and creates nothing. After 5 failed attempts in 15
        minutes the next one is 429 `RATE_LIMITED` with `Retry-After`. While an
        unexpired pending request exists a new one is 409
        `REQUEST_ALREADY_PENDING`. The archive is fetched from `downloadPath`
        for 24 hours; no email or SMS is sent.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
      responses:
        '202':
          description: Export requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportRequestAccepted'
        '400':
          description: '`VALIDATION_ERROR` (missing `password`, unknown field)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`STEP_UP_FAILED` (wrong password) or `ACCOUNT_DELETION_PENDING`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          $ref: '#/components/responses/RequestAlreadyPending'
        '429':
          $ref: '#/components/responses/RateLimited'
  /account/export/{requestId}:
    get:
      tags: [Account]
      summary: Download the member's own export archive
      description: |
        Served only to the member who made the request: another member's token
        gets 404 `EXPORT_NOT_FOUND`. The link is valid for 24 hours; after that
        it is 410 `EXPORT_EXPIRED`. The archive holds the member's profile,
        settings, verification status, photo metadata, consents, interests sent
        and received and shortlists. It never holds a password hash, a refresh
        token, a full ID number or another member's contact details.
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 'The archive, sent with `Cache-Control: private, no-store`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportArchive'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`EXPORT_NOT_FOUND` (unknown, malformed or another member''s request)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: '`EXPORT_EXPIRED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /account/delete-request:
    post:
      tags: [Account]
      summary: Request deletion of the account
      description: |
        Step-up: the body carries the member's password (errors as for the
        export request). The account is purged after the cooling-off
        (`ACCOUNT_DELETION_COOLING_OFF_DAYS`, default 30). From now until it is
        cancelled the member is hidden from discovery, search, profile detail,
        shortlists and interest lists and cannot be sent interests; they can
        still log in, but every route except cancel and logout is 403
        `ACCOUNT_DELETION_PENDING` (`details.scheduledPurgeAt`). Only the member
        can request or cancel; no admin endpoint exists. Data is not shared
        with third parties.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
      responses:
        '202':
          description: Deletion scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRequestAccepted'
        '400':
          description: '`VALIDATION_ERROR` (missing `password`, unknown field)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`STEP_UP_FAILED` (wrong password)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          $ref: '#/components/responses/RequestAlreadyPending'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [Account]
      summary: Cancel the pending account deletion
      description: |
        Within the cooling-off this restores the account fully (200). After
        `scheduledPurgeAt` it is 410 `ACCOUNT_PURGED`. With no pending request
        it is 404 `DELETE_REQUEST_NOT_FOUND`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Deletion cancelled
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`DELETE_REQUEST_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: '`ACCOUNT_PURGED`: the cooling-off has ended'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from POST /admin/login (admin secret)
  parameters:
    ShortlistId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShortlistProfileRef:
      name: profileRef
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    InterestId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InterestStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/InterestStatus'
    InterestLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    InterestCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 512 }
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    AccountDeletionPending:
      description: '`ACCOUNT_DELETION_PENDING`: the account is scheduled for deletion; `details.scheduledPurgeAt` says when'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RequestAlreadyPending:
      description: '`REQUEST_ALREADY_PENDING`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: '`RATE_LIMITED`: 5 failed step-up attempts in 15 minutes; `Retry-After` gives the seconds to wait'
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ShortlistBadRequest:
      description: '`VALIDATION_ERROR` (field-level on `name`, unknown field such as `userId` or `isDefault`, `limit` out of 1..50), `INVALID_CURSOR` or `CANNOT_SHORTLIST_SELF`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ShortlistNotFound:
      description: '`SHORTLIST_NOT_FOUND` (also for another member''s list)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ShortlistConflict:
      description: '`SHORTLIST_NAME_TAKEN`, `DEFAULT_SHORTLIST_PROTECTED`, or `SHORTLIST_LIMIT_EXCEEDED` (configuration-dependent: only when `SHORTLIST_MAX_LISTS` or `SHORTLIST_MAX_PROFILES` is set)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InterestPage:
      description: One page of interests
      content:
        application/json:
          schema:
            type: object
            required: [items, nextCursor]
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/InterestListItem'
              nextCursor:
                type: [string, 'null']
                description: Null on the last page.
    InterestDone:
      description: The interest after the action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Interest'
    InterestBadRequest:
      description: '`VALIDATION_ERROR` (unknown field or a `status` outside the enum, `limit` out of 1..50) or `INVALID_CURSOR`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InterestNotFound:
      description: '`INTEREST_NOT_FOUND` (also for another member''s interest)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InterestInvalidTransition:
      description: '`INVALID_STATUS_TRANSITION`: the status does not allow this action'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AdminBadRequest:
      description: '`VALIDATION_ERROR` (malformed `userId`, unknown or forbidden body field, notes over 500 characters, empty notes or sections) or `INVALID_REASON_CODE` (allowed values in `details.allowed`)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AdminForbidden:
      description: A valid member token; the admin role is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AdminNotFound:
      description: '`NOT_FOUND`: no such member or no submission'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AdminInvalidTransition:
      description: '`INVALID_STATUS_TRANSITION`: the profile is not in review (already decided, blocked or never submitted); nothing was written'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ReviewDecisionDone:
      description: Decision recorded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReviewDecisionResult'
    KycBadRequest:
      description: '`VALIDATION_ERROR`: unknown field or malformed value, with field-level `details.issues`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    KycNotFound:
      description: '`VERIFICATION_NOT_FOUND` or `MEDIA_NOT_FOUND` (also returned for another member''s media id)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    KycInvalidTransition:
      description: '`INVALID_STATUS_TRANSITION`: the case status does not allow this action'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ProfileNotApproved:
      description: '`PROFILE_NOT_APPROVED`; `details.status` is the caller''s current status'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ConsentError:
      description: Unknown document, stale version/hash or missing required consent
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ProfileReviewStatus:
      type: string
      enum: [draft, submitted, approved, needsChanges, rejected]
      description: |
        Review state of a member's profile. Transitions: draft to submitted
        (submit), submitted to draft (withdraw), submitted to approved,
        needsChanges or rejected (admin), needsChanges to submitted (resubmit),
        rejected to needsChanges (admin reopen). Also returned by
        `GET /profiles/me` as `profile.user.profileReviewStatus`.
    ProfileSubmissionResult:
      type: object
      required: [status, submittedAt]
      properties:
        status:
          $ref: '#/components/schemas/ProfileReviewStatus'
        submittedAt:
          type: string
          format: date-time
          nullable: true
          description: Start of the review SLA clock; null while the profile is a draft
    ReopenProfileRequest:
      type: object
      required: [reasonCode]
      additionalProperties: false
      properties:
        reasonCode:
          type: string
        notes:
          type: string
          maxLength: 500
    SavePersonalDetailsRequest:
      type: object
      required: [gender, dateOfBirth]
      properties:
        gender:
          type: string
          enum: [male, female]
        dateOfBirth:
          type: string
          format: date
          description: Real calendar date, YYYY-MM-DD
          example: '2000-01-31'
        heightCm:
          type: integer
          minimum: 120
          maximum: 240
        weightKg:
          type: integer
          minimum: 30
          maximum: 200
        physicalStatus:
          type: string
          enum: [normal, physicallyChallenged]
        maritalStatus:
          type: string
          enum: [neverMarried, widower, awaitingDivorce, divorced]
        spokenLanguages:
          type: array
          items:
            type: string
        eatingHabits:
          type: string
          enum: [vegetarian, nonVegetarian, eggetarian]
        residentStatus:
          type: string
    ConsentLanguage:
      type: string
      enum: [en, hi, gu]
      default: en
    ConsentInput:
      type: object
      required: [code, version, documentHash]
      properties:
        code:
          type: string
          example: terms
        version:
          type: string
          example: '1.0'
        documentHash:
          type: string
          description: SHA-256 hash of the active document
          example: 6f1c2e9a5b7d4f3e8a0c2b1d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f
    RecordConsentRequest:
      allOf:
        - $ref: '#/components/schemas/ConsentInput'
        - type: object
          properties:
            language:
              $ref: '#/components/schemas/ConsentLanguage'
    ConsentDocument:
      type: object
      required: [code, version, hash, effectiveAt]
      properties:
        code:
          type: string
        version:
          type: string
        hash:
          type: string
        effectiveAt:
          type: string
          format: date-time
    CurrentConsent:
      allOf:
        - $ref: '#/components/schemas/ConsentDocument'
        - type: object
          required: [text, accepted, expired, requiresReconsent]
          properties:
            text:
              type: string
              description: Exact text served in the requested language
            accepted:
              type: boolean
              description: Whether the member has any record for this code
            grantedAt:
              type: [string, 'null']
              format: date-time
            expiresAt:
              type: [string, 'null']
              format: date-time
            expired:
              type: boolean
              description: True when the latest record's expiresAt has passed
            requiresReconsent:
              type: boolean
              description: True when there is no record, the record expired, or a newer document version is active
    CurrentConsentsResponse:
      type: object
      required: [language, consents]
      properties:
        language:
          type: string
          enum: [en, hi, gu]
        consents:
          type: array
          items:
            $ref: '#/components/schemas/CurrentConsent'
    ConsentDocumentSummary:
      allOf:
        - $ref: '#/components/schemas/ConsentDocument'
        - type: object
          required: [text]
          properties:
            text:
              type: string
              description: Exact text served in the requested language
    ConsentDocumentsResponse:
      type: object
      required: [language, documents]
      properties:
        language:
          type: string
          enum: [en, hi, gu]
        documents:
          type: array
          items:
            $ref: '#/components/schemas/ConsentDocumentSummary'
    ConsentRecord:
      type: object
      required:
        - id
        - userId
        - userName
        - code
        - version
        - documentHash
        - textSnapshot
        - language
        - ip
        - userAgent
        - grantedAt
        - expiresAt
        - source
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        userName:
          type: string
        code:
          type: string
        version:
          type: string
        documentHash:
          type: string
        textSnapshot:
          type: string
          description: Exact text served for this version and language
        language:
          $ref: '#/components/schemas/ConsentLanguage'
        ip:
          type: string
        userAgent:
          type: string
        grantedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Exactly 24 calendar months after grantedAt
        revokedAt:
          type: [string, 'null']
          format: date-time
        source:
          type: string
          enum: [registration, api, renewal]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConsentRecordsResponse:
      type: object
      required: [total, records]
      properties:
        total:
          type: integer
        records:
          type: array
          items:
            $ref: '#/components/schemas/ConsentRecord'
    ReviewReasonCode:
      type: string
      enum:
        - unreadable-document
        - expired-document
        - name-mismatch
        - photo-mismatch
        - under-age
        - prohibited-content
        - incomplete-profile
        - duplicate-account
        - suspicious-activity
        - terms-violation
        - other
    ReviewQueue:
      type: object
      required: [total, profiles]
      properties:
        total:
          type: integer
        profiles:
          type: array
          items:
            type: object
            required: [userId, profileUid, name, submittedAt, slaRemainingHours, slaState]
            properties:
              userId:
                type: string
                format: uuid
              profileUid:
                type: string
                nullable: true
              name:
                type: string
              submittedAt:
                type: string
                format: date-time
              slaRemainingHours:
                type: number
                description: Business hours left; negative when overdue
              slaState:
                type: string
                enum: [ok, atRisk, overdue]
    ReviewWorkspace:
      type: object
      required: [userId, name, ageCheck, photo, idDocument]
      properties:
        userId:
          type: string
          format: uuid
        profileUid:
          type: string
          nullable: true
        name:
          type: string
        dateOfBirth:
          type: string
          format: date
          nullable: true
        age:
          type: integer
          nullable: true
        ageCheck:
          type: string
          enum: [pass, fail]
        accountStatus:
          type: string
        kycStatus:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time
          nullable: true
        documentType:
          type: string
          nullable: true
        idNumberMasked:
          type: string
          nullable: true
          example: '****9012'
        photo:
          type: object
          required: [url, expiresAt, contentType]
          properties:
            url:
              type: string
            expiresAt:
              type: string
              format: date-time
            contentType:
              type: string
        idDocument:
          type: object
          required: [href, contentType]
          properties:
            href:
              type: string
              description: Audited endpoint that returns the signed URL
            contentType:
              type: string
    ReviewDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        reasonCode:
          $ref: '#/components/schemas/ReviewReasonCode'
        notes:
          type: string
          maxLength: 500
        sections:
          type: array
          items:
            type: string
            enum: [step-1, step-2, step-3, step-4, step-5]
    ReviewDecisionResult:
      type: object
      required: [message, userId, decision, status, statusBefore, statusAfter]
      properties:
        message:
          type: string
        userId:
          type: string
          format: uuid
        decision:
          type: string
          enum: [approve, reject, requestChanges, reopen]
        reasonCode:
          $ref: '#/components/schemas/ReviewReasonCode'
        status:
          $ref: '#/components/schemas/ProfileReviewStatus'
          description: Profile review status after the decision (`needsChanges` for reopen).
        statusBefore:
          type: string
          description: KYC status before; for `reopen` the profile review status before (`rejected`).
        statusAfter:
          type: string
          description: KYC status after; for `reopen` the profile review status after (`needsChanges`).
    DiscoveryCard:
      type: object
      additionalProperties: false
      required: [profileRef, firstName, age, city, religion, community, profession, photoRef, verified]
      properties:
        profileRef:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: Opaque, random, stable reference; not derived from any internal id.
        firstName: { type: string }
        age: { type: integer, description: Computed from the date of birth, never stored. }
        city: { type: [string, 'null'] }
        religion: { type: [string, 'null'] }
        community: { type: [string, 'null'] }
        profession: { type: [string, 'null'] }
        photoRef:
          type: [string, 'null']
          description: |
            Reference to the individual primary approved photo; null when the
            member has none. Family, group and pre-wedding photos are never
            referenced.
        verified: { type: boolean }
    ProfileDetail:
      allOf:
        - $ref: '#/components/schemas/DiscoveryCard'
        - type: object
          required: [heightCm, maritalStatus, diet, spokenLanguages, subcommunity, state, country, education, employmentType, familyStatus, aboutMyself, lookingFor]
          properties:
            heightCm: { type: [integer, 'null'] }
            maritalStatus: { type: [string, 'null'] }
            diet: { type: [string, 'null'] }
            spokenLanguages:
              type: array
              items: { type: string }
            subcommunity: { type: [string, 'null'] }
            state: { type: [string, 'null'] }
            country: { type: [string, 'null'] }
            education: { type: [string, 'null'] }
            employmentType: { type: [string, 'null'] }
            familyStatus: { type: [string, 'null'] }
            aboutMyself: { type: [string, 'null'] }
            lookingFor: { type: [string, 'null'] }
    InterestStatus:
      type: string
      enum: [pending, accepted, declined, withdrawn]
      description: '`expired` is reserved in the database and never returned in Phase 1.'
    SendInterestRequest:
      type: object
      additionalProperties: false
      required: [receiverProfileRef]
      properties:
        receiverProfileRef:
          type: string
          pattern: '^[0-9a-f]{32}$'
    Interest:
      type: object
      required: [id, status, statusLabel, canChat, createdAt, respondedAt]
      properties:
        id: { type: string, format: uuid }
        status:
          $ref: '#/components/schemas/InterestStatus'
        statusLabel:
          type: [string, 'null']
          description: '"Not accepted" for the sender''s view of a declined interest; otherwise null. Never a reason.'
        canChat:
          type: boolean
          description: Derived, never stored. True only when `status` is `accepted`, in either direction.
        createdAt: { type: string, format: date-time }
        respondedAt:
          type: [string, 'null']
          format: date-time
          description: Set on accept and decline.
    InterestListItem:
      allOf:
        - $ref: '#/components/schemas/Interest'
        - type: object
          required: [member]
          properties:
            member:
              $ref: '#/components/schemas/DiscoveryCard'
    ClearCooldownRequest:
      type: object
      additionalProperties: false
      required: [senderProfileUid, receiverProfileRef, reasonCode]
      properties:
        senderProfileUid: { type: string }
        receiverProfileRef:
          type: string
          pattern: '^[0-9a-f]{32}$'
        reasonCode:
          type: string
          enum: [member-appeal, admin-error, goodwill, other]
        notes: { type: string, maxLength: 500 }
    Shortlist:
      type: object
      required: [id, name, isDefault, profileCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        isDefault:
          type: boolean
          description: True for the one list named `Shortlisted`; it cannot be renamed or deleted.
        profileCount:
          type: integer
          description: Stored memberships, including profiles that are currently not visible.
        createdAt: { type: string, format: date-time }
    ShortlistNameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 1 to 100 characters after trim. Unique per member, case-insensitively.
    ShortlistProfilePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryCard'
        nextCursor:
          type: [string, 'null']
          description: Null on the last page.
    AccountSettings:
      type: object
      required: [language, notifications, profileVisibility]
      properties:
        language:
          type: string
          enum: [en, hi, gu]
        notifications:
          $ref: '#/components/schemas/NotificationPrefs'
        profileVisibility:
          type: string
          enum: [all, hidden]
    NotificationPrefs:
      type: object
      description: In-app notification switches.
      properties:
        interestReceived: { type: boolean }
        interestAccepted: { type: boolean }
        profileApproved: { type: boolean }
        newMessage: { type: boolean }
        profileViewed: { type: boolean }
      additionalProperties: false
    AccountSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        language:
          type: string
          enum: [en, hi, gu]
        notifications:
          $ref: '#/components/schemas/NotificationPrefs'
        profileVisibility:
          type: string
          enum: [all, hidden]
    StepUpRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: The member's current password, re-verified for this action.
    ExportRequestAccepted:
      type: object
      required: [requestId, status, expiresAt, downloadPath]
      properties:
        requestId: { type: string, format: uuid }
        status: { type: string, enum: [pending] }
        expiresAt: { type: string, format: date-time, description: 24 hours after the request }
        downloadPath: { type: string, example: /api/v1/account/export/00000000-0000-0000-0000-000000000000 }
    DeleteRequestAccepted:
      type: object
      required: [status, requestedAt, scheduledPurgeAt]
      properties:
        status: { type: string, enum: [pending] }
        requestedAt: { type: string, format: date-time }
        scheduledPurgeAt:
          type: string
          format: date-time
          description: Request time plus the configured cooling-off (30 days by default).
    ExportArchive:
      type: object
      required: [format, version, exportedAt, account, settings, verification, photos, consents, interests, shortlists]
      properties:
        format: { type: string, enum: [dhobi-matrimony-export] }
        version: { type: integer }
        exportedAt: { type: string, format: date-time }
        account: { type: object, description: The member's own account and profile sections. }
        settings:
          $ref: '#/components/schemas/AccountSettings'
        verification:
          type: [object, 'null']
          description: Status, document type and last 4 characters of the ID number only.
        photos: { type: array, items: { type: object } }
        consents: { type: array, items: { type: object } }
        interests:
          type: object
          required: [sent, received]
          properties:
            sent: { type: array, items: { type: object } }
            received: { type: array, items: { type: object } }
        shortlists: { type: array, items: { type: object } }
    ErrorEnvelope:
      type: object
      required: [code, message, details, requestId]
      properties:
        code:
          type: string
          example: CONSENT_REQUIRED
        message:
          type: string
        details:
          description: >-
            Machine-readable error details. For missing consents this is
            `{ "missingConsents": ["terms"] }`.
          oneOf:
            - type: object
            - type: array
            - type: 'null'
        requestId:
          type: string
    KycVerification:
      type: object
      required: [id, status, documentType, idNumberLast4, media, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [consentGiven, documentUploaded, needsReview, changesNeeded, failed, approved]
        documentType:
          type: string
          nullable: true
          enum: [aadhaar, pan, drivingLicence, rationCard, voterId, other]
        idNumberLast4:
          type: string
          nullable: true
          maxLength: 4
          description: Last 4 characters of the ID number; the full number is never returned
        media:
          type: array
          items:
            type: object
            required: [mediaId, purpose, contentType, sizeBytes, attachedAt]
            properties:
              mediaId:
                type: string
                format: uuid
              purpose:
                type: string
                enum: [kycPhoto, kycId]
              contentType:
                type: string
              sizeBytes:
                type: integer
              attachedAt:
                type: string
                format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    KycUploadRequest:
      type: object
      additionalProperties: false
      required: [purpose, contentType, sizeBytes, fileName]
      properties:
        purpose:
          type: string
          enum: [kycPhoto, kycId]
        contentType:
          type: string
          example: image/jpeg
        sizeBytes:
          type: integer
          minimum: 1
          description: Declared size; above 10485760 is rejected with FILE_TOO_LARGE
        fileName:
          type: string
          maxLength: 255
        documentType:
          type: string
          enum: [aadhaar, pan, drivingLicence, rationCard, voterId, other]
          description: Required when purpose is kycId
        idNumber:
          type: string
          description: Required when purpose is kycId; 4 to 32 letters, digits, spaces or hyphens
    KycUploadTicket:
      type: object
      required: [mediaId, uploadUrl, method, headers, expiresAt]
      properties:
        mediaId:
          type: string
          format: uuid
        uploadUrl:
          type: string
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    KycCompleteRequest:
      type: object
      additionalProperties: false
      required: [checksum]
      properties:
        checksum:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
          description: SHA-256 of the uploaded bytes, hex
    RegisterRequest:
      type: object
      required:
        - fullName
        - email
        - password
        - countryCode
        - mobileNumber
        - profileCreatedBy
        - consents
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 20
        countryCode:
          type: string
          example: '+91'
        mobileNumber:
          type: string
          example: '9876543210'
        profileCreatedBy:
          type: string
          enum: [myself, son, daughter, brother, sister, friend, relative]
        gender:
          type: string
          enum: [male, female]
        language:
          $ref: '#/components/schemas/ConsentLanguage'
        consents:
          type: array
          minItems: 3
          description: Must contain current terms, privacy and id_processing consents
          items:
            $ref: '#/components/schemas/ConsentInput'
    RegisterResponse:
      type: object
      required: [message, userId, mobile, otpToken, otpExpiresAt]
      properties:
        message:
          type: string
        userId:
          type: string
          format: uuid
        mobile:
          type: string
        otpToken:
          type: string
        otpExpiresAt:
          type: string
          format: date-time
        otpCode:
          type: string
          description: Only present outside production
