openapi: 3.1.0
info:
  title: Dhobi Matrimony API
  version: 1.0.0
  description: |
    Contract for the Dhobi Matrimony member and admin API. The consent
    endpoints record append-only, versioned evidence of what a member agreed
    to, in which language and version, from which IP and device, and when the
    agreement expires.
servers:
  - url: /api/v1
tags:
  - name: Consents
    description: Versioned consent documents and append-only consent records
  - name: Auth
    description: Registration, OTP and sessions
  - name: Profiles
    description: Member profile steps
security:
  - bearerAuth: []
paths:
  /consents/documents:
    get:
      tags: [Consents]
      security: []
      summary: Active consent documents for pre-registration clients
      description: |
        Public. Returns every active consent document with the `code`, `version`
        and `hash` that POST /auth/register requires, plus the exact text served
        in the requested language. Language resolution matches
        GET /consents/current: query parameter, then Accept-Language, then
        English, with a per-document fallback to English. No member data is
        exposed.
      parameters:
        - name: language
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ConsentLanguage'
      responses:
        '200':
          description: Active consent documents in the resolved language
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentDocumentsResponse'
        '400':
          description: Unsupported explicit language value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /consents/current:
    get:
      tags: [Consents]
      summary: Current consent documents for the authenticated member
      description: |
        Returns every active consent document. Text is served in the requested
        language (query parameter, then Accept-Language) and falls back to
        English when a translation is missing. The latest record for each code
        is included so the client can show whether consent is current, expired
        or requires re-consent.
      parameters:
        - name: language
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ConsentLanguage'
      responses:
        '200':
          description: Active consent documents and the member's latest record per code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentConsentsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /consents:
    get:
      tags: [Consents]
      summary: The member's own consent records, newest first
      responses:
        '200':
          description: Append-only consent history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecordsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Consents]
      summary: Record acceptance of the currently active consent document
      description: |
        Writes one append-only record with the member id and name, the exact
        text served for the document version and language, the client IP and
        user agent, the grant time, an expiry exactly 24 months later and the
        source. A version or document hash that does not match the active
        document is rejected and no record is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordConsentRequest'
      responses:
        '201':
          description: The stored consent record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
        '400':
          $ref: '#/components/responses/ConsentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /consents/renew:
    post:
      tags: [Consents]
      summary: Re-consent after the 24-month expiry
      description: |
        Writes a new append-only record with a fresh grant time and expiry. The
        earlier record is left unchanged. The request and response bodies are
        identical to POST /consents; the stored source is `renewal`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordConsentRequest'
      responses:
        '201':
          description: The new consent record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
        '400':
          $ref: '#/components/responses/ConsentError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Start registration and record the required consents
      description: |
        Requires the terms, privacy and id_processing consents. When any is
        missing or stale the request fails with the shared error envelope and
        the details list the missing consent codes; no account is created. A
        successful registration writes one consent record per accepted code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration started; an OTP is issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Validation failure or missing/stale required consents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: An account already exists with these details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /profiles/step-1:
    put:
      tags: [Profiles]
      summary: Save personal details (step 1), enforcing the minimum age
      description: |
        Saves gender, date of birth and the other personal details. Age is
        derived from `dateOfBirth` and today's UTC date in whole calendar years
        and is never stored. A member whose gender minimum (`AGE_MIN_MALE`,
        default 21; `AGE_MIN_FEMALE`, default 18) is not met is rejected with
        `AGE_BELOW_MINIMUM`; a date of birth in the future is rejected with
        `INVALID_DATE_OF_BIRTH`. A person born on 29 February reaches each
        birthday on 1 March in non-leap years. Nothing is saved on rejection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePersonalDetailsRequest'
      responses:
        '200':
          description: Personal details saved; the member's profile is returned
          content:
            application/json:
              schema:
                type: object
        '400':
          description: |
            Rejected. `code` is one of `AGE_BELOW_MINIMUM` (details
            `{ "minimumAge": 21 }`), `INVALID_DATE_OF_BIRTH` (future date), or
            `VALIDATION_ERROR` (details `{ "issues": [...] }`, including a
            `dateOfBirth` issue for a value that is not a real calendar date).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                belowMinimum:
                  value:
                    code: AGE_BELOW_MINIMUM
                    message: Members must be at least 21 years old.
                    details: { minimumAge: 21 }
                    requestId: 7d0c6c3e-0f0b-4b0e-9f5e-2f1f3f2f1a11
                futureDate:
                  value:
                    code: INVALID_DATE_OF_BIRTH
                    message: Date of birth must be a real date that is not in the future.
                    details: { field: dateOfBirth }
                    requestId: 7d0c6c3e-0f0b-4b0e-9f5e-2f1f3f2f1a12
        '401':
          $ref: '#/components/responses/Unauthorized'
  /kyc/verification:
    post:
      tags: [KYC]
      summary: Create the member's manual KYC case
      description: |
        Requires a valid, unexpired consent for every required code (story 1).
        The case starts as `consentGiven`. A member has at most one case.
        The body must be empty: any field (for example `status` or `userId`) is
        rejected with `VALIDATION_ERROR`. Responses carry
        `Cache-Control: private, no-store`.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Case created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycVerification'
        '400':
          $ref: '#/components/responses/KycBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Consent is missing, expired or stale (`CONSENT_REQUIRED`); no case is created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`VERIFICATION_ALREADY_EXISTS`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      tags: [KYC]
      summary: Read the member's KYC case
      description: |
        The ID number is returned only as `idNumberLast4`. No storage key is
        ever returned.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycVerification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/KycNotFound'
  /kyc/verification/uploads:
    post:
      tags: [KYC]
      summary: Request a presigned upload URL
      description: |
        The client uploads the bytes straight to object storage with `PUT` to
        `uploadUrl`, sending the returned `headers`; no file bytes pass through
        this API. The URL expires in 10 minutes. For `kycId`, `documentType` and
        `idNumber` are required; the number is stored encrypted. `kycPhoto`
        accepts JPEG, PNG, WebP; `kycId` also accepts PDF; at most 10 MB
        (10485760 bytes) each.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycUploadRequest'
      responses:
        '201':
          description: Upload ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycUploadTicket'
        '400':
          description: |
            `VALIDATION_ERROR` (field-level issues, e.g. an unlisted
            `documentType`), `FILE_TOO_LARGE` (declared size above 10 MB),
            `FILE_TYPE_NOT_ALLOWED` (type not accepted at all) or
            `FILE_TYPE_NOT_ALLOWED_FOR_PURPOSE` (e.g. a PDF for `kycPhoto`).
            Nothing is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/KycNotFound'
        '409':
          $ref: '#/components/responses/KycInvalidTransition'
  /kyc/verification/uploads/{mediaId}/complete:
    post:
      tags: [KYC]
      summary: Confirm an upload and attach it to the case
      description: |
        The API checks that the object exists, that its size equals the declared
        size, that its SHA-256 equals `checksum`, and that its leading bytes
        (magic bytes) match the declared type and are allowed for the purpose.
        On success the file is attached; the case becomes `documentUploaded`
        and, once both files are present, `needsReview`. On any rejection
        nothing is attached. Repeating the call for an attached file is a no-op.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycCompleteRequest'
      responses:
        '200':
          description: The updated case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycVerification'
        '400':
          description: |
            `UPLOAD_NOT_FOUND`, `SIZE_MISMATCH`, `CHECKSUM_MISMATCH`,
            `FILE_CONTENT_MISMATCH` (bytes are not the declared type, e.g. text
            renamed `.jpg`), `FILE_TYPE_NOT_ALLOWED_FOR_PURPOSE` (e.g. PDF bytes
            for `kycPhoto`) or `VALIDATION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/KycNotFound'
        '409':
          $ref: '#/components/responses/KycInvalidTransition'
  /kyc/verification/uploads/{mediaId}:
    delete:
      tags: [KYC]
      summary: Discard an upload that was never attached
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '204':
          description: Discarded
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/KycNotFound'
        '409':
          description: '`MEDIA_ALREADY_ATTACHED`; replace an attached file by uploading a new one'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /kyc/verification/media/{mediaId}/url:
    get:
      tags: [KYC]
      summary: Get a short-lived signed read URL for an attached file
      description: The URL expires in 10 minutes; an expired or altered URL is refused by storage with 403.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Signed URL
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/KycBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/KycNotFound'
  /kyc/verification/restart:
    post:
      tags: [KYC]
      summary: Restart a failed or changes-needed case
      description: |
        Allowed only from `failed` or `changesNeeded`, at most 3 times in a
        rolling 24 hours. The fourth attempt returns 429 `RESTART_LIMIT_REACHED`
        with a `Retry-After` header (seconds). A restart clears the uploaded
        files and the ID details and returns the case to `consentGiven`.
        Requires valid consent. The body must be empty.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The restarted case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycVerification'
        '400':
          $ref: '#/components/responses/KycBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`CONSENT_REQUIRED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/KycNotFound'
        '409':
          $ref: '#/components/responses/KycInvalidTransition'
        '429':
          description: '`RESTART_LIMIT_REACHED`'
          headers:
            Retry-After:
              description: Seconds until a restart is allowed again
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    KycBadRequest:
      description: '`VALIDATION_ERROR`: unknown field or malformed value, with field-level `details.issues`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    KycNotFound:
      description: '`VERIFICATION_NOT_FOUND` or `MEDIA_NOT_FOUND` (also returned for another member''s media id)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    KycInvalidTransition:
      description: '`INVALID_STATUS_TRANSITION`: the case status does not allow this action'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ConsentError:
      description: Unknown document, stale version/hash or missing required consent
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    SavePersonalDetailsRequest:
      type: object
      required: [gender, dateOfBirth]
      properties:
        gender:
          type: string
          enum: [male, female]
        dateOfBirth:
          type: string
          format: date
          description: Real calendar date, YYYY-MM-DD
          example: '2000-01-31'
        heightCm:
          type: integer
          minimum: 120
          maximum: 240
        weightKg:
          type: integer
          minimum: 30
          maximum: 200
        physicalStatus:
          type: string
          enum: [normal, physicallyChallenged]
        maritalStatus:
          type: string
          enum: [neverMarried, widower, awaitingDivorce, divorced]
        spokenLanguages:
          type: array
          items:
            type: string
        eatingHabits:
          type: string
          enum: [vegetarian, nonVegetarian, eggetarian]
        residentStatus:
          type: string
    ConsentLanguage:
      type: string
      enum: [en, hi, gu]
      default: en
    ConsentInput:
      type: object
      required: [code, version, documentHash]
      properties:
        code:
          type: string
          example: terms
        version:
          type: string
          example: '1.0'
        documentHash:
          type: string
          description: SHA-256 hash of the active document
          example: 6f1c2e9a5b7d4f3e8a0c2b1d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f
    RecordConsentRequest:
      allOf:
        - $ref: '#/components/schemas/ConsentInput'
        - type: object
          properties:
            language:
              $ref: '#/components/schemas/ConsentLanguage'
    ConsentDocument:
      type: object
      required: [code, version, hash, effectiveAt]
      properties:
        code:
          type: string
        version:
          type: string
        hash:
          type: string
        effectiveAt:
          type: string
          format: date-time
    CurrentConsent:
      allOf:
        - $ref: '#/components/schemas/ConsentDocument'
        - type: object
          required: [text, accepted, expired, requiresReconsent]
          properties:
            text:
              type: string
              description: Exact text served in the requested language
            accepted:
              type: boolean
              description: Whether the member has any record for this code
            grantedAt:
              type: [string, 'null']
              format: date-time
            expiresAt:
              type: [string, 'null']
              format: date-time
            expired:
              type: boolean
              description: True when the latest record's expiresAt has passed
            requiresReconsent:
              type: boolean
              description: True when there is no record, the record expired, or a newer document version is active
    CurrentConsentsResponse:
      type: object
      required: [language, consents]
      properties:
        language:
          type: string
          enum: [en, hi, gu]
        consents:
          type: array
          items:
            $ref: '#/components/schemas/CurrentConsent'
    ConsentDocumentSummary:
      allOf:
        - $ref: '#/components/schemas/ConsentDocument'
        - type: object
          required: [text]
          properties:
            text:
              type: string
              description: Exact text served in the requested language
    ConsentDocumentsResponse:
      type: object
      required: [language, documents]
      properties:
        language:
          type: string
          enum: [en, hi, gu]
        documents:
          type: array
          items:
            $ref: '#/components/schemas/ConsentDocumentSummary'
    ConsentRecord:
      type: object
      required:
        - id
        - userId
        - userName
        - code
        - version
        - documentHash
        - textSnapshot
        - language
        - ip
        - userAgent
        - grantedAt
        - expiresAt
        - source
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        userName:
          type: string
        code:
          type: string
        version:
          type: string
        documentHash:
          type: string
        textSnapshot:
          type: string
          description: Exact text served for this version and language
        language:
          $ref: '#/components/schemas/ConsentLanguage'
        ip:
          type: string
        userAgent:
          type: string
        grantedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Exactly 24 calendar months after grantedAt
        revokedAt:
          type: [string, 'null']
          format: date-time
        source:
          type: string
          enum: [registration, api, renewal]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConsentRecordsResponse:
      type: object
      required: [total, records]
      properties:
        total:
          type: integer
        records:
          type: array
          items:
            $ref: '#/components/schemas/ConsentRecord'
    ErrorEnvelope:
      type: object
      required: [code, message, details, requestId]
      properties:
        code:
          type: string
          example: CONSENT_REQUIRED
        message:
          type: string
        details:
          description: Machine-readable error details; for missing consents this is `{ "missingConsents": ["terms"] }`
          oneOf:
            - type: object
            - type: array
            - type: 'null'
        requestId:
          type: string
    KycVerification:
      type: object
      required: [id, status, documentType, idNumberLast4, media, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [consentGiven, documentUploaded, needsReview, changesNeeded, failed, approved]
        documentType:
          type: string
          nullable: true
          enum: [aadhaar, pan, drivingLicence, rationCard, voterId, other]
        idNumberLast4:
          type: string
          nullable: true
          maxLength: 4
          description: Last 4 characters of the ID number; the full number is never returned
        media:
          type: array
          items:
            type: object
            required: [mediaId, purpose, contentType, sizeBytes, attachedAt]
            properties:
              mediaId:
                type: string
                format: uuid
              purpose:
                type: string
                enum: [kycPhoto, kycId]
              contentType:
                type: string
              sizeBytes:
                type: integer
              attachedAt:
                type: string
                format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    KycUploadRequest:
      type: object
      additionalProperties: false
      required: [purpose, contentType, sizeBytes, fileName]
      properties:
        purpose:
          type: string
          enum: [kycPhoto, kycId]
        contentType:
          type: string
          example: image/jpeg
        sizeBytes:
          type: integer
          minimum: 1
          description: Declared size; above 10485760 is rejected with FILE_TOO_LARGE
        fileName:
          type: string
          maxLength: 255
        documentType:
          type: string
          enum: [aadhaar, pan, drivingLicence, rationCard, voterId, other]
          description: Required when purpose is kycId
        idNumber:
          type: string
          description: Required when purpose is kycId; 4 to 32 letters, digits, spaces or hyphens
    KycUploadTicket:
      type: object
      required: [mediaId, uploadUrl, method, headers, expiresAt]
      properties:
        mediaId:
          type: string
          format: uuid
        uploadUrl:
          type: string
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    KycCompleteRequest:
      type: object
      additionalProperties: false
      required: [checksum]
      properties:
        checksum:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
          description: SHA-256 of the uploaded bytes, hex
    RegisterRequest:
      type: object
      required:
        - fullName
        - email
        - password
        - countryCode
        - mobileNumber
        - profileCreatedBy
        - consents
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 20
        countryCode:
          type: string
          example: '+91'
        mobileNumber:
          type: string
          example: '9876543210'
        profileCreatedBy:
          type: string
          enum: [myself, son, daughter, brother, sister, friend, relative]
        gender:
          type: string
          enum: [male, female]
        language:
          $ref: '#/components/schemas/ConsentLanguage'
        consents:
          type: array
          minItems: 3
          description: Must contain current terms, privacy and id_processing consents
          items:
            $ref: '#/components/schemas/ConsentInput'
    RegisterResponse:
      type: object
      required: [message, userId, mobile, otpToken, otpExpiresAt]
      properties:
        message:
          type: string
        userId:
          type: string
          format: uuid
        mobile:
          type: string
        otpToken:
          type: string
        otpExpiresAt:
          type: string
          format: date-time
        otpCode:
          type: string
